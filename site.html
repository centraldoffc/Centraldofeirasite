<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central do FFC | Central do Feira — Notícias do Feira FC</title>
<meta name="description" content="Central do FFC, também conhecida como Central do Feira: notícias, jogos e bastidores do Feira Futebol Clube.">
<link rel="canonical" href="https://centraldofeira.vercel.app/site">
<meta property="og:site_name" content="Central do FFC">
<meta property="og:title" content="Central do FFC | Central do Feira — Notícias">
<meta property="og:url" content="https://centraldofeira.vercel.app/site">
<link rel="icon" href="/assets/central-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050f0d; --accent:#6FA89E; --hi:#8CC4B9; --ink:#EDF3F1;
    --dim:rgba(237,243,241,.66); --faint:rgba(237,243,241,.42);
    --card:#0c1a17; --line:rgba(120,160,155,.16);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:'Inter',-apple-system,sans-serif;color:var(--ink);min-height:100dvh;
    background:radial-gradient(100% 45% at 0 100%,#10302a 0,transparent 60%),var(--bg)}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit}
  .wrap{width:min(100%,1120px);margin:0 auto;padding:0 16px}

  /* topo */
  .top{position:sticky;top:0;z-index:20;background:rgba(5,15,13,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;height:58px}
  .brand{display:flex;align-items:center;gap:9px;font-family:'Archivo Black',sans-serif;font-size:16px;white-space:nowrap}
  .brand img{width:32px;height:32px;border-radius:50%;border:1px solid var(--line)}
  .nav{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{flex:none;font-size:13px;font-weight:500;color:var(--dim);background:none;border:0;border-radius:99px;padding:7px 14px;cursor:pointer;transition:background .2s,color .2s}
  .nav button:hover{color:var(--ink)}
  .nav button.on{background:var(--accent);color:#04120f;font-weight:700}
  button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  /* imagens e etiquetas */
  .ph{position:relative;background:#12302a center/cover no-repeat;overflow:hidden}
  .ph.logo::before{content:"";position:absolute;inset:0;background:url(/assets/central-logo.svg) center/34% no-repeat;opacity:.16}
  .ph.logo{background-image:linear-gradient(135deg,#17413a,#0a1c18)}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:4px 9px;border-radius:6px;background:var(--accent);color:#04120f}
  .meta{font-size:12px;color:var(--faint)}

  /* destaques */
  .top-grid{display:grid;gap:14px;padding:18px 0 8px}
  .hero{position:relative;width:100%;min-width:0;display:flex;align-items:flex-end;min-height:0;aspect-ratio:9/10;border-radius:22px;overflow:hidden}
  .hero .ph{position:absolute;inset:0}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(4,12,10,.94) 0%,rgba(4,12,10,.66) 28%,rgba(4,12,10,.12) 57%,transparent 75%)}
  .hero .in{position:relative;z-index:1;padding:18px;width:100%}
  .hero .meta{font-size:11px;color:#c5d1cb}
  .hero .ph.logo::before{background-position:center 25%;opacity:.45}
  .hero h2{font-family:Inter,'Plus Jakarta Sans',Arial,sans-serif;font-weight:700;font-size:clamp(18px,4.8vw,26px);line-height:1.25;letter-spacing:-.02em;margin:0 0 9px;color:#fff;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 4px #0005}
  .hero p{margin:0 0 8px;font-size:14px;line-height:1.5;color:var(--dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .side{display:grid;gap:14px;grid-template-columns:1fr 1fr}
  .mini{position:relative;display:flex;align-items:flex-end;min-height:170px;border-radius:14px;overflow:hidden}
  .mini .ph{position:absolute;inset:0}
  .mini::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(4,12,10,.95) 5%,rgba(4,12,10,.1) 80%)}
  .mini .in{position:relative;z-index:1;padding:12px}
  .mini h3{margin:8px 0 4px;font-size:14px;line-height:1.28;font-weight:700}

  /* corpo */
  .main{display:grid;gap:26px;padding:22px 0 44px}
  .sec{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 14px}
  .sec h2{font-family:'Archivo Black',sans-serif;font-weight:400;font-size:21px;margin:0}
  .sec span{font-size:12px;color:var(--faint)}
  .grid{display:grid;gap:14px;grid-template-columns:1fr}
  .card{display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line);transition:border-color .2s,transform .2s}
  .card:hover{border-color:rgba(111,168,158,.55);transform:translateY(-2px)}
  .card .ph{aspect-ratio:16/9}
  .card .bd{padding:13px 14px 15px;display:flex;flex-direction:column;gap:7px;flex:1}
  .card h3{margin:0;font-size:16px;line-height:1.3;font-weight:700}
  .card p{margin:0;font-size:13.5px;line-height:1.5;color:var(--dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .more{display:block;margin:20px auto 0;font-size:13.5px;font-weight:600;color:var(--ink);background:none;border:1px solid var(--line);border-radius:99px;padding:10px 24px;cursor:pointer}
  .more:hover{border-color:var(--accent)}

  /* notícia aberta */
  .art{max-width:720px;margin:0 auto;padding:22px 0 30px}
  .back{display:inline-block;font-size:13.5px;font-weight:600;color:var(--hi);background:none;border:0;padding:6px 0;cursor:pointer;margin-bottom:12px}
  .art h1{font-family:'Archivo Black',sans-serif;font-weight:400;font-size:clamp(26px,7vw,42px);line-height:1.1;margin:12px 0}
  .art .lead{font-size:17px;line-height:1.55;color:var(--dim);margin:0 0 18px}
  .art .ph{aspect-ratio:16/9;border-radius:16px;margin:16px 0 22px}
  .art .txt p{font-size:16.5px;line-height:1.75;margin:0 0 18px}

  .art .txt h2,.art .txt h3{font-family:'Archivo Black',sans-serif;font-weight:400;font-size:24px;line-height:1.2;margin:30px 0 10px}
  .art .txt a{color:var(--hi);text-decoration:underline}
  .art .txt img{display:block;max-width:100%;height:auto;border-radius:12px;margin:8px auto 20px}
  .art .txt blockquote{margin:0 0 18px;padding:4px 0 4px 16px;border-left:3px solid var(--accent);color:var(--dim)}
  .art .txt ul,.art .txt ol{padding-left:22px;margin:0 0 18px;font-size:16.5px;line-height:1.7}
  .empty{padding:50px 10px;text-align:center;color:var(--dim)}
  [hidden]{display:none!important}

  @media (min-width:720px){
    .grid{grid-template-columns:repeat(2,1fr)}
    .top-grid{grid-template-columns:2fr 1fr}
    .side{grid-template-columns:1fr}
    .hero{min-height:0}
    .mini{min-height:208px}
    
  }
  @media (min-width:1000px){ .grid{grid-template-columns:repeat(3,1fr)} }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}

  /* Notícias abaixo do destaque: foto à esquerda e informação ao lado. */
  .top-grid{display:block;max-width:600px;margin-inline:auto}
  #grid{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
  .news-row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:16px;padding:18px 0;border-bottom:1px solid var(--line);align-items:center}
  .news-row>.ph{width:104px;height:112px;border-radius:16px;background-position:center}
  .news-row-text{min-width:0;text-align:left;align-self:center;position:relative;top:10px}.news-row h3{font-family:Inter,'Plus Jakarta Sans',Arial,sans-serif;font-size:16px;font-weight:700;line-height:1.35;margin:0 0 10px;overflow-wrap:anywhere}
  .news-row time{font-size:11px;color:var(--faint)}
  @media(min-width:720px){.news-row{grid-template-columns:140px minmax(0,1fr);gap:22px}.news-row>.ph{width:140px;height:130px}.news-row h3{font-size:20px}}
  @media(max-width:360px){.news-row{grid-template-columns:88px minmax(0,1fr);gap:12px}.news-row>.ph{width:88px;height:102px}.news-row h3{font-size:15px}}
</style>
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/assets/leitura.css">
<script src="/assets/article-format.js"></script>
<script defer src="/assets/leitura.js"></script>
<link rel="stylesheet" href="/assets/brand.css">
</head>
<body class="brand-dark">
<header class="top">
  <div class="wrap">
    <div class="bar">
      <a class="brand" href="#/"><img class="ffc-logo" src="/assets/central-logo.svg" alt="Central do FFC" width="32" height="32"></a>
    </div>
  </div>
</header>

<div class="wrap" id="home">
  <section class="top-grid" id="top"></section>
  <div class="main">
    <section>
      <div class="grid" id="grid"></div>
      <p class="empty" id="empty" hidden>Nenhuma notícia por aqui ainda.</p>
      <button class="more" id="more" hidden>Carregar mais notícias</button>
    </section>
  </div>
</div>

<div class="wrap" id="article" hidden></div>
<footer style="border-top:1px solid var(--line);padding:22px 16px;text-align:center;font-size:13px;color:var(--faint)"><a href="/termos">Termos de Serviço</a> &nbsp;·&nbsp; <a href="/privacidade">Política de Privacidade</a></footer>


<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const PAGE = 6;
  let all = [], shown = PAGE, loaded = false;


  function ago(d){
    const m = Math.round((Date.now() - new Date(d)) / 60000);
    if (m < 60) return `há ${Math.max(m,1)} min`;
    if (m < 1440) return `há ${Math.round(m/60)} h`;
    if (m < 43200) return `há ${Math.round(m/1440)} d`;
    return new Date(d).toLocaleDateString('pt-BR');
  }
  const ph = (a, extra='') => `<div class="ph ${a.image_url ? '' : 'logo'} ${extra}"${a.image_url ? ` style="background-image:url('${esc(a.image_url)}')"` : ''}></div>`;
  const href = a => a.slug ? `/noticia/${a.slug}` : `#/n/${a.id}`;

  function renderHome(){
    const list = all;
    const hero = list.filter(a => a.featured).sort((a,b) => new Date(b.updated_at || b.created_at) - new Date(a.updated_at || a.created_at))[0] || list[0];
    const rest = list.filter(a => a !== hero).sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
    const feed = rest;

    $('top').innerHTML = hero ? `<a class="hero" href="${href(hero)}" aria-label="${esc(hero.title)}">${ph(hero)}<div class="in"><h2>${esc(hero.title)}</h2><span class="meta">${ago(hero.created_at)}</span></div></a>` : '';
    $('grid').innerHTML = feed.slice(0, shown).map(a => `<a class="news-row" href="${href(a)}">${ph(a)}<div class="news-row-text"><h3>${esc(a.title)}</h3><time datetime="${esc(a.created_at)}">${ago(a.created_at)}</time></div></a>`).join('');

    $('more').hidden = feed.length <= shown;
    $('empty').hidden = list.length > 0;
  }

  const OK = new Set(['P','BR','B','STRONG','I','EM','U','A','H2','H3','UL','OL','LI','BLOCKQUOTE','IMG','FIGURE','FIGCAPTION','DIV','SPAN']);
  function clean(root){
    root.querySelectorAll('*').forEach(el => {
      const t = el.tagName;
      if (!OK.has(t)){ /^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|FORM|LINK|META)$/.test(t) ? el.remove() : el.replaceWith(...el.childNodes); return; }
      [...el.attributes].forEach(at => { if (!((t === 'A' && at.name === 'href') || (t === 'IMG' && (at.name === 'src' || at.name === 'alt' || (at.name === 'data-width' && ['50','75','100'].includes(at.value)) || (at.name === 'data-align' && ['left','center','right'].includes(at.value)))))) el.removeAttribute(at.name); });
      if (t === 'A'){ if (!/^(https?:|mailto:)/i.test(el.getAttribute('href') || '')) el.removeAttribute('href'); el.target = '_blank'; el.rel = 'noopener noreferrer'; }
      if (t === 'IMG' && !/^https:/i.test(el.getAttribute('src') || '')) el.remove();
    });
  }

  async function renderArticle(id){
    let a = null;
    try { const r = await fetch('/api/noticias?id=' + encodeURIComponent(id)); if (r.ok) a = await r.json(); } catch {}
    if (!a){ location.hash = '#/'; return; }
    if (a.slug) { location.replace('/noticia/' + encodeURIComponent(a.slug)); return; }
    const paras = (a.content || '').split(/\n{2,}/).map(p => p.trim()).filter(Boolean);
    $('article').innerHTML = `<article class="art">
      <a class="news-back" href="#/">← Todas as notícias</a>
<div class="reading-tools" role="group" aria-label="Preferências de leitura"><button type="button" data-reading-action="size" aria-label="Aumentar texto. Tamanho padrão">Texto padrão</button><button type="button" data-reading-action="theme" aria-pressed="false">Leitura escura</button><span class="reading-status" role="status" aria-live="polite"></span></div>
      <h1>${esc(a.title)}</h1>
      ${a.summary ? `<p class="lead">${esc(a.summary)}</p>` : ''}
      <div class="news-meta"><time datetime="${esc(a.created_at)}">${new Date(a.created_at).toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric',timeZone:'America/Bahia'})}</time><span>${esc(a.author || 'Redação Central do FFC')}</span><span>${Math.max(1,Math.ceil(String(a.content || '').replace(/<[^>]*>/g,' ').trim().split(/\s+/).length/200))} min de leitura</span></div>
      ${a.image_url ? ph(a) : ''}
      <div class="txt news-content">${/<[a-z][\s\S]*>/i.test(a.content || '') ? a.content : paras.map(p => `<p>${esc(p).replace(/\n/g,'<br>')}</p>`).join('')}</div><a class="news-back news-bottom" href="#/">← Voltar às notícias</a></article>`;
    clean(document.querySelector('.art .txt'));
    if (FFCArticle.hasInlineImage(document.querySelector('.art .txt').innerHTML, a.image_url)) document.querySelector('.art > .ph')?.remove();
    document.title = `${a.title} — Central do FFC`;
  }

  function route(){
    if (!loaded) return;
    const m = location.hash.match(/^#\/n\/(.+)$/);
    $('home').hidden = !!m; $('article').hidden = !m;
    if (m) renderArticle(m[1]); else document.title = 'Central do FFC | Central do Feira — Notícias do Feira FC';
    window.scrollTo(0, 0);
  }

  $('more').onclick = () => { shown += PAGE; renderHome(); };
  window.addEventListener('hashchange', route);

  let loadingNews = false;
  async function loadNews(initial = false) {
    if (loadingNews) return; loadingNews = true;
    try {
      const r = await fetch('/api/noticias?limit=50', { cache: 'no-store' });
      if (!r.ok) throw new Error('api');
      all = (await r.json()).items || [];
    } catch (e) { if (loaded) return; $('empty').textContent = 'Não foi possível carregar as notícias agora. Tente de novo em instantes.'; $('empty').hidden = false; return; } finally { loadingNews = false; }
    loaded = true; renderHome(); if (initial) route();
  }
  loadNews(true);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadNews(); });
  window.addEventListener('pageshow', event => { if (event.persisted) loadNews(); });
</script>
</body>
</html>
