<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central do FFC — site em construção</title>
<meta name="description" content="O site da Central do FFC está em construção. Enquanto isso, acompanhe a cobertura do Feira FC pelas nossas redes.">
<link rel="icon" href="/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #050f0d;
    --grid-line: rgba(120, 160, 155, 0.055);
    --accent: #6FA89E;
    --accent-strong: #8CC4B9;
    --ink: #EDF3F1;
    --ink-dim: rgba(237, 243, 241, 0.62);
    --card-border: rgba(120, 160, 155, 0.14);
  }

  *{ box-sizing:border-box; }

  html{
    min-height:100%;
    background:
      radial-gradient(110% 60% at 8% 100%, #12332c 0%, transparent 55%),
      radial-gradient(80% 50% at 100% 0%, #0d211d 0%, transparent 50%),
      var(--bg);
  }

  body{
    margin:0;
    min-height:100dvh;
    font-family:'Inter', -apple-system, 'Segoe UI', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    align-items:center;
    overflow-x:hidden;
    position:relative;
  }

  .grid-layer{
    position:fixed;
    inset:-20% -20%;
    background-image:
      repeating-linear-gradient(35deg, var(--grid-line) 0 1px, transparent 1px 72px),
      repeating-linear-gradient(-55deg, var(--grid-line) 0 1px, transparent 1px 72px);
    pointer-events:none;
    mask-image: radial-gradient(75% 55% at 50% 40%, black 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(75% 55% at 50% 40%, black 30%, transparent 80%);
  }

  main{
    position:relative;
    z-index:1;
    width:100%;
    max-width:620px;
    padding:40px 22px 48px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .logo{
    width:56px;
    height:56px;
    border-radius:50%;
    object-fit:cover;
    border:1px solid var(--card-border);
    box-shadow:0 14px 32px -16px rgba(0,0,0,0.75);
    margin-bottom:28px;
  }

  /* Campo desenhado: o único movimento da página */
  .pitch{
    width:100%;
    height:auto;
    margin-bottom:34px;
    overflow:visible;
  }
  .pitch .line{
    fill:none;
    stroke:var(--accent);
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:1;
    stroke-dashoffset:1;
    animation:draw 1.6s cubic-bezier(.65,.05,.25,1) forwards;
  }
  .pitch .l2{ animation-delay:.35s; }
  .pitch .l3{ animation-delay:.7s; }
  .pitch .spot{
    fill:var(--accent-strong);
    opacity:0;
    animation:appear .4s ease 1.7s forwards;
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  @keyframes appear{ to{ opacity:1; } }

  h1{
    font-family:'Archivo Black', sans-serif;
    font-weight:400;
    font-size:clamp(34px, 8vw, 52px);
    line-height:1.04;
    letter-spacing:-0.02em;
    margin:0 0 16px;
  }

  p{
    margin:0 0 30px;
    max-width:44ch;
    font-size:15.5px;
    line-height:1.6;
    color:var(--ink-dim);
  }

  .btn{
    display:inline-block;
    padding:13px 26px;
    border-radius:999px;
    background:var(--accent);
    color:#04120f;
    font-weight:600;
    font-size:14.5px;
    text-decoration:none;
    transition:background .2s ease, transform .2s ease;
  }
  .btn:hover{ background:var(--accent-strong); }
  .btn:active{ transform:scale(.98); }
  .btn:focus-visible{
    outline:2px solid var(--ink);
    outline-offset:3px;
  }

  @media (prefers-reduced-motion: reduce){
    .pitch .line{ animation:none; stroke-dashoffset:0; }
    .pitch .spot{ animation:none; opacity:1; }
  }
</style>
</head>
<body>
  <div class="grid-layer" aria-hidden="true"></div>

  <main>
    <img class="logo" src="/mark.png" alt="Central do FFC" width="56" height="56">

    <svg class="pitch" viewBox="0 0 640 420" role="img" aria-label="Desenho de um campo de futebol sendo traçado">
      <!-- bordas e meio de campo -->
      <rect class="line" pathLength="1" x="10" y="10" width="620" height="400" rx="4"/>
      <path class="line l2" pathLength="1" d="M320 10 V410"/>
      <circle class="line l2" pathLength="1" cx="320" cy="210" r="50"/>
      <!-- áreas esquerda -->
      <rect class="line l3" pathLength="1" x="10" y="100" width="100" height="220"/>
      <rect class="line l3" pathLength="1" x="10" y="160" width="36" height="100"/>
      <path class="line l3" pathLength="1" d="M110 189 A40 40 0 0 1 110 231"/>
      <!-- áreas direita -->
      <rect class="line l3" pathLength="1" x="530" y="100" width="100" height="220"/>
      <rect class="line l3" pathLength="1" x="594" y="160" width="36" height="100"/>
      <path class="line l3" pathLength="1" d="M530 189 A40 40 0 0 0 530 231"/>
      <!-- pontos -->
      <circle class="spot" cx="320" cy="210" r="4"/>
      <circle class="spot" cx="76" cy="210" r="3"/>
      <circle class="spot" cx="564" cy="210" r="3"/>
    </svg>

    <h1>Site em construção</h1>
    <p>Estamos montando a casa nova da Central do FFC. Enquanto isso, a cobertura do Feira FC continua nas nossas redes.</p>
    <a class="btn" href="/">Ver nossos links</a>
  </main>
</body>
</html>
