<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#04140d">
<title>Agência | Central do FFC</title>
<link rel="icon" href="/mark.png">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/gerenciar.css">
<link rel="stylesheet" href="assets/agencia.css">
</head>
<body class="ag-page">

<!-- LOGIN -->
<div class="ag-gate" id="gLogin" hidden>
  <form class="lbox" id="fLogin" autocomplete="on">
    <img class="logo" src="/mark.png" alt="">
    <span class="pill"><svg class="icon" aria-hidden="true"><use href="#ag-lock"/></svg>Área dos funcionários</span>
    <h2>Agência Central do FFC</h2>
    <p>Entre com seu ID e sua senha para acessar o painel da equipe.</p>
    <label>ID<input type="text" id="lid" inputmode="text" autocapitalize="none" autocomplete="username" placeholder="Seu ID" required></label>
    <label>Senha<span class="ag-field"><input type="password" id="lpw" autocomplete="current-password" placeholder="Sua senha" required><button class="ag-eye" type="button" data-eye aria-label="Mostrar senha"><svg class="icon" aria-hidden="true"><use href="#ag-eye"/></svg></button></span></label>
    <div class="err" id="lerr" role="alert"></div>
    <button class="btn g" type="submit">Entrar</button>
  </form>
</div>

<!-- BLOQUEIO -->
<div class="ag-gate" id="gLock" hidden>
  <form class="lbox" id="fLock">
    <span id="lkAv"></span>
    <span class="pill"><svg class="icon" aria-hidden="true"><use href="#ag-lock"/></svg>Painel bloqueado</span>
    <h2 id="lkName"></h2>
    <p>O painel foi bloqueado para proteger sua conta. Digite sua senha para continuar de onde parou.</p>
    <label>Senha<span class="ag-field"><input type="password" id="lkpw" autocomplete="current-password" placeholder="Sua senha" required><button class="ag-eye" type="button" data-eye aria-label="Mostrar senha"><svg class="icon" aria-hidden="true"><use href="#ag-eye"/></svg></button></span></label>
    <div class="err" id="lkerr" role="alert"></div>
    <button class="btn g" type="submit"><svg class="icon" aria-hidden="true"><use href="#ag-lock"/></svg>Desbloquear</button>
    <button class="ag-link" type="button" id="lkOut">Não é você? Sair</button>
  </form>
</div>

<!-- APP -->
<div class="app" id="app" hidden>
  <button class="backdrop" aria-label="Fechar menu" tabindex="-1" id="bd"></button>
  <aside id="sidebar" aria-label="Navegação da agência">
    <button class="mobile-close" aria-label="Fechar menu" id="mc">×</button>
    <div class="brand"><img src="/mark.png" alt=""><div>Central do FFC<small>Agência</small></div></div>
    <button class="nav on" data-v="inicio"><svg class="icon" aria-hidden="true"><use href="#ag-home"/></svg>Visão geral</button>
    <button class="nav" data-v="avisos"><svg class="icon" aria-hidden="true"><use href="#ag-mega"/></svg>Avisos<span class="nav-count" data-b="notices" hidden></span></button>
    <button class="nav" data-v="tarefas"><svg class="icon" aria-hidden="true"><use href="#ag-task"/></svg>Tarefas<span class="nav-count" data-b="tasks" hidden></span></button>
    <button class="nav" data-v="calendario"><svg class="icon" aria-hidden="true"><use href="#ag-cal"/></svg>Calendário</button>
    <button class="nav" data-v="arquivos"><svg class="icon" aria-hidden="true"><use href="#ag-folder"/></svg>Arquivos</button>
    <button class="nav" data-v="chat"><svg class="icon" aria-hidden="true"><use href="#ag-chat"/></svg>Conversas<span class="nav-count" data-b="chat" hidden></span></button>
    <button class="nav" data-v="noticias" hidden><svg class="icon" aria-hidden="true"><use href="#ag-news"/></svg>Notícias</button>
    <button class="nav" data-v="modelos" hidden><svg class="icon" aria-hidden="true"><use href="#ag-layout"/></svg>Modelos de design</button>
    <button class="nav" data-v="equipe"><svg class="icon" aria-hidden="true"><use href="#ag-team"/></svg>Equipe</button>
    <button class="nav" data-v="pedidos"><svg class="icon" aria-hidden="true"><use href="#ag-inbox"/></svg>Pedidos<span class="nav-count" data-b="req" hidden></span></button>
    <button class="nav" data-v="atividade" id="navAct" hidden><svg class="icon" aria-hidden="true"><use href="#ag-pulse"/></svg>Atividade</button>
    <a class="nav" href="/gerenciar" id="navAdm" hidden><svg class="icon" aria-hidden="true"><use href="#ag-right"/></svg>Painel editorial</a>
    <div class="sp"></div>
    <button class="ag-sbuser" id="sbMe" aria-label="Meu perfil"><span id="sbAv"></span><div><strong id="sbName"></strong><small id="sbRole"></small></div></button>
    <button class="nav" id="btnLock"><svg class="icon" aria-hidden="true"><use href="#ag-lock"/></svg>Bloquear painel</button>
    <button class="nav" id="btnOut"><svg class="icon" aria-hidden="true"><use href="#ag-out"/></svg>Sair</button>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <button class="menu-toggle" aria-label="Abrir menu" aria-controls="sidebar" aria-expanded="false" id="mt"><svg class="icon" aria-hidden="true"><use href="#ag-menu"/></svg></button>
      <span class="ag-title" id="ttl">Visão geral</span>
      <div class="topbar-right">
        <button class="ag-ib" id="bell" aria-label="Notificações"><svg class="icon" aria-hidden="true"><use href="#ag-bell"/></svg><span class="nav-count" id="bellDot" hidden></span></button>
        <button class="ag-user" id="meBtn" aria-label="Meu perfil"><span id="meAv"></span><div><strong id="meName"></strong><small id="meRole"></small></div></button>
      </div>
    </header>
    <main class="main-panel ag-root" id="ag-root"></main>
  </div>
</div>

<script src="assets/supabase.min.js"></script>
<script src="config.js"></script>
<script src="assets/agencia.js"></script>
<script>
const sb = supabase.createClient(FFC_SUPABASE_URL, FFC_SUPABASE_KEY);
const $ = s => document.querySelector(s);
const DOMAIN = 'membros.centraldoffc.app', IDLE = 15 * 60 * 1000;
let sessionEmail = '', ready = false, locked = false, lastAct = Date.now(), justLogged = false, booting = false;

function gate(w) { $('#gLogin').hidden = w !== 'login'; $('#gLock').hidden = w !== 'lock'; $('#app').hidden = w !== 'app'; }
document.addEventListener('click', e => { const b = e.target.closest('[data-eye]'); if (!b) return; const i = b.parentElement.querySelector('input'); i.type = i.type === 'password' ? 'text' : 'password'; });

/* menu lateral no celular */
const setMenu = o => { $('#app').classList.toggle('menu-open', o); $('#mt').setAttribute('aria-expanded', String(o)); };
$('#mt').onclick = () => setMenu(true); $('#mc').onclick = () => setMenu(false); $('#bd').onclick = () => setMenu(false);
document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });
document.querySelectorAll('aside .nav[data-v]').forEach(b => b.onclick = () => { AG.go(b.dataset.v); setMenu(false); });
$('#bell').onclick = () => AG.openNotifs();
$('#meBtn').onclick = () => AG.openMe();
$('#sbMe').onclick = () => { setMenu(false); AG.openMe(); };
$('#btnOut').onclick = logout; $('#lkOut').onclick = logout; $('#btnLock').onclick = () => lock(false);

/* login */
$('#fLogin').onsubmit = async e => {
  e.preventDefault(); const id = $('#lid').value.trim().toLowerCase(); $('#lerr').textContent = '';
  const email = id.includes('@') ? id : `${id}@${DOMAIN}`; justLogged = true;
  const { error } = await sb.auth.signInWithPassword({ email, password: $('#lpw').value });
  if (error) { justLogged = false; $('#lerr').textContent = 'ID ou senha incorretos.'; }
};
$('#fLock').onsubmit = async e => {
  e.preventDefault(); $('#lkerr').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: sessionEmail, password: $('#lkpw').value });
  if (error) { $('#lkerr').textContent = 'Senha incorreta.'; return; }
  $('#lkpw').value = ''; locked = false; lastAct = Date.now(); gate('app'); AG.log('desbloqueou o painel');
};
async function logout() { ready = false; locked = false; AG.destroy(); await sb.auth.signOut(); }

sb.auth.onAuthStateChange((ev, s) => {
  if (!s) { ready = false; gate('login'); return; }
  if (ready || booting) return;
  const fresh = justLogged; justLogged = false; sessionEmail = s.user.email || '';
  setTimeout(() => boot(fresh), 0);
});
sb.auth.getSession().then(({ data }) => { if (!data.session) gate('login'); });

async function boot(fresh) {
  booting = true;
  const ok = await AG.init({
    sb, mount: $('#ag-root'),
    onView: v => { document.querySelectorAll('aside .nav[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === v)); $('#ttl').textContent = AG.TITLES[v] || ''; },
    onBadges: b => {
      document.querySelectorAll('[data-b]').forEach(el => { const n = b[el.dataset.b] || 0; el.hidden = !n; el.textContent = n > 99 ? '99+' : n; });
      $('#bellDot').hidden = !b.notifs; $('#bellDot').textContent = b.notifs > 9 ? '9+' : b.notifs; drawMe();
    },
    onMe: drawMe,
    onDenied: async () => { await sb.auth.signOut(); gate('login'); $('#lerr').textContent = 'Esta conta não tem acesso à agência.'; }
  });
  booting = false; if (!ok) return;
  ready = true; lastAct = Date.now(); gate('app'); drawMe();
  $('#navAct').hidden = !AG.isLeader();
  ['noticias', 'modelos'].forEach(v => { const n = document.querySelector(`aside .nav[data-v="${v}"]`); if (n) n.hidden = !AG.can(v); });
  sb.rpc('is_admin').then(r => { $('#navAdm').hidden = r.data !== true; });
  AG.go('inicio'); if (fresh) AG.log('entrou no painel');
}
function drawMe() { const m = AG.me; if (!m) return; $('#meAv').innerHTML = AG.av(m, 40); $('#meName').textContent = AG.first(m.name); $('#meRole').textContent = m.role_title; $('#sbAv').innerHTML = AG.av(m, 42); $('#sbName').textContent = AG.first(m.name); $('#sbRole').textContent = m.role_title; }

/* bloqueio por inatividade */
['click', 'keydown', 'touchstart', 'scroll'].forEach(ev => addEventListener(ev, () => { if (!locked) lastAct = Date.now(); }, { passive: true }));
setInterval(() => { if (ready && !locked && Date.now() - lastAct > IDLE) lock(true); }, 20000);
function lock(auto) {
  const m = AG.me; if (!m) return; locked = true; setMenu(false); AG.closeModal();
  $('#lkAv').innerHTML = AG.av(m, 84); $('#lkName').textContent = AG.first(m.name); gate('lock');
  AG.log(auto ? 'teve o painel bloqueado por inatividade' : 'bloqueou o painel');
}
</script>
</body>
</html>
