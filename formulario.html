<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Formulário | Central do FFC</title>
<link rel="icon" href="/mark.png">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root{--bg:#d9d5d0;--dark:#10261b;--g:#175a3b;--g2:#0f4129;--lime:#e3fcba;--ink:#17221b;--dim:#69766e;--line:#d9dfdb;--red:#bc4545;--f:'Plus Jakarta Sans',Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f);min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}[hidden]{display:none!important}
:focus-visible{outline:3px solid #55ad7b;outline-offset:2px}
.nav{background:var(--dark);color:#e9efe9;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100% - 1000px)/2));padding-top:env(safe-area-inset-top,0)}
.nav b{display:flex;align-items:center;gap:10px;font-size:15px;letter-spacing:-.02em}.nav img{width:30px;height:30px;border-radius:8px}.nav span{font-size:12px;color:#a9b9ae}
.wrap{max-width:1000px;margin:24px auto;padding:0 16px 40px}
.steps{background:#fff;border-radius:18px;padding:14px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 6px #0001;overflow-x:auto}
.steps>small{font-weight:600;white-space:nowrap;margin-right:6px}
.pill{display:flex;align-items:center;gap:7px;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:7px 14px;font-size:12px;white-space:nowrap;background:#f6f7f6}
.pill i{font-style:normal;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;border:1px solid currentColor}
.pill.now{border-color:var(--g);color:var(--g);background:#fff}.pill.done{background:var(--g);border-color:var(--g);color:#fff}
.bar{flex:1;min-width:10px;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:300px 1fr;gap:16px;margin-top:16px;align-items:start}
.side{background:var(--g);color:#fff;border-radius:18px;padding:24px 20px;display:flex;flex-direction:column;gap:14px;min-height:480px;box-shadow:0 8px 24px #10412a40}
.side h1{font-size:21px;line-height:1.25;margin:0;letter-spacing:-.03em}.side p{margin:0;color:#c6dccd;font-size:13px}
.side hr{border:0;border-top:1px solid #ffffff2e;width:100%;margin:2px 0}
.side small{color:#c6dccd;font-size:12px}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;justify-content:space-between;align-items:center;border:1px solid #ffffff55;border-radius:9px;padding:11px 14px;font-size:13px}
.li.now{background:var(--lime);color:var(--g2);border-color:var(--lime);font-weight:600}.li.done{opacity:.75}
.sp{flex:1}.nv{display:flex;gap:10px}
.b{border:0;border-radius:99px;padding:12px 18px;font-weight:600;font-size:13px;min-height:44px;flex:1;cursor:pointer}
.b.w{background:#fff;color:var(--ink)}.b.l{background:var(--lime);color:var(--g2)}.b:disabled{opacity:.5;cursor:not-allowed}
.card{background:#fcfcfb;border-radius:18px;padding:28px;box-shadow:0 2px 6px #0001}
.card h2{font-size:15px;margin:0 0 18px;font-weight:600}
.f{margin-bottom:18px}.f>label,.f>.l{display:block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;font-weight:500;margin-bottom:6px}
.f em{color:var(--red);font-style:normal}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],select,textarea{width:100%;background:#f7f7f6;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px}
textarea{min-height:110px;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:10px 22px}.opts label{display:flex;gap:8px;align-items:center;cursor:pointer;font-size:14px}
.opts input{accent-color:var(--g);width:17px;height:17px;margin:0}
.err{color:var(--red);font-size:12px;margin-top:5px}.f.bad input,.f.bad select,.f.bad textarea{border-color:var(--red)}
.ok{text-align:center;padding:50px 10px}.ok .c{width:62px;height:62px;border-radius:50%;background:var(--lime);color:var(--g2);display:grid;place-items:center;margin:0 auto 18px;font-size:28px}
.ok h2{font-size:22px;margin-bottom:8px}.ok p{color:var(--dim);margin:0}
.msg{text-align:center;padding:80px 20px;color:var(--dim)}
@media(max-width:820px){.grid{grid-template-columns:1fr}.side{min-height:0}.side .sp{display:none}.card{padding:20px}.steps>small{display:none}}

.lk{background:0;border:0;color:#fff;font-weight:600;text-decoration:underline;cursor:pointer;padding:0;font-size:12px}.me{font-size:12px;color:#c6dccd;word-break:break-all}
</style>
</head>
<body>
<div class="nav"><b><img src="/mark.png" alt="">Central do FFC</b><span>Formulário</span></div>
<div class="wrap" id="app"><div class="msg">Carregando…</div></div>
<script src="/assets/supabase.min.js"></script>
<script src="/config.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sb=supabase.createClient(FFC_SUPABASE_URL,FFC_SUPABASE_KEY);
const slug=new URLSearchParams(location.search).get('f')||location.pathname.split('/').filter(Boolean).pop();
let form,steps=[],cur=0,val={},errs={},me=null,busy=false;
const toLogin=()=>location.replace('/login?next='+encodeURIComponent(location.pathname+location.search));
const msg=(t,p)=>$('app').innerHTML=`<div class="msg"><h2>${t}</h2><p>${p||''}</p></div>`;
/* ---------- formulário (só depois do login) ---------- */
async function start(){
  const {data}=await sb.auth.getSession();const s=data.session;
  if(!s||!s.user.email_confirmed_at)return toLogin();
  $('app').innerHTML='<div class="msg">Carregando…</div>';
  let r,j;try{r=await fetch('/api/formularios?slug='+encodeURIComponent(slug||''),{headers:{Authorization:'Bearer '+s.access_token}});j=await r.json()}catch{return msg('Sem conexão','Tente novamente em instantes.')}
  if(r.status===401){await sb.auth.signOut();return toLogin()}
  if(!r.ok)return msg('Formulário não encontrado','Ele pode ter sido encerrado ou o link está incorreto.');
  form=j.form;me={email:j.user.email,name:j.user.name||j.user.email.split('@')[0]};
  document.title=form.title+' | Central do FFC';
  if(j.answered)return msg('Você já respondeu','Obrigado por participar, '+esc(me.name.split(' ')[0])+'. Cada conta responde uma vez.');
  steps=(form.steps||[]).filter(s=>(s.fields||[]).length);cur=0;val={};errs={};draw();
}
async function out(){await sb.auth.signOut();toLogin()}

function field(f){
  const v=val[f.id]??(f.type==='checkbox'?[]:''),n='f_'+f.id,o=f.options||[];
  let h='';
  if(f.type==='textarea')h=`<textarea id="${n}" data-id="${f.id}">${esc(v)}</textarea>`;
  else if(f.type==='select')h=`<select id="${n}" data-id="${f.id}"><option value="">Escolha uma opção</option>${o.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
  else if(f.type==='radio'||f.type==='checkbox')h=`<div class="opts">${o.map(x=>`<label><input type="${f.type}" name="${n}" data-id="${f.id}" value="${esc(x)}" ${(f.type==='radio'?v===x:v.includes(x))?'checked':''}>${esc(x)}</label>`).join('')}</div>`;
  else h=`<input type="${f.type}" id="${n}" data-id="${f.id}" value="${esc(v)}">`;
  const lab=f.type==='radio'||f.type==='checkbox'?`<span class="l">${esc(f.label)}${f.required?' <em>*</em>':''}</span>`:`<label for="${n}">${esc(f.label)}${f.required?' <em>*</em>':''}</label>`;
  return `<div class="f ${errs[f.id]?'bad':''}">${lab}${h}${errs[f.id]?`<div class="err" role="alert">${esc(errs[f.id])}</div>`:''}</div>`;
}
function draw(){
  const s=steps[cur],last=cur===steps.length-1;
  const pills=steps.map((x,i)=>`<div class="pill ${i<cur?'done':i===cur?'now':''}"><i>${i<cur?'✓':i+1}</i>${esc(x.title)}</div>`).join('<div class="bar"></div>');
  $('app').innerHTML=`<div class="steps"><small>Responder formulário</small>${pills}</div>
  <div class="grid"><aside class="side"><h1>${esc(form.title)}</h1>${form.description?`<p>${esc(form.description)}</p>`:''}<hr><small>Etapas</small>
    <div class="list">${steps.map((x,i)=>`<div class="li ${i===cur?'now':i<cur?'done':''}">${esc(x.title)}<span>${i<cur?'✓':''}</span></div>`).join('')}</div>
    <div class="sp"></div><div class="me">${esc(me.name)} · ${esc(me.email)}<br><button class="lk" id="out">Sair</button></div><hr><div class="nv"><button class="b w" id="prev" ${cur?'':'disabled'}>Anterior</button><button class="b l" id="next">${last?'Enviar':'Próxima'}</button></div></aside>
  <section class="card"><h2>${esc(s.title)}</h2>${s.fields.map(field).join('')}</section></div>`;
  $('prev').onclick=()=>{collect();cur--;errs={};draw();scrollTo(0,0)};$('next').onclick=next;$('out').onclick=out;
}
function collect(){
  steps[cur].fields.forEach(f=>{
    const els=[...document.querySelectorAll(`[data-id="${f.id}"]`)];
    if(f.type==='checkbox')val[f.id]=els.filter(e=>e.checked).map(e=>e.value);
    else if(f.type==='radio')val[f.id]=(els.find(e=>e.checked)||{}).value||'';
    else val[f.id]=(els[0]?.value||'').trim();
  });
}
function check(){
  errs={};
  steps[cur].fields.forEach(f=>{
    const v=val[f.id],empty=Array.isArray(v)?!v.length:!v;
    if(empty&&f.required)errs[f.id]='Preencha este campo.';
    else if(!empty&&f.type==='email'&&!/^\S+@\S+\.\S+$/.test(v))errs[f.id]='E-mail inválido.';
  });
  return !Object.keys(errs).length;
}
async function next(){
  collect(); if(!check()){draw();return;}
  if(cur<steps.length-1){cur++;draw();scrollTo(0,0);return;}
  const b=$('next');b.disabled=true;b.textContent='Enviando…';
  const {data}=await sb.auth.getSession();if(!data.session){return toLogin()}
  try{
    const r=await fetch('/api/formularios?slug='+encodeURIComponent(slug),{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+data.session.access_token},body:JSON.stringify({answers:val})});
    const j=await r.json().catch(()=>({}));
    if(r.status===201)return $('app').innerHTML=`<div class="card ok"><div class="c">✓</div><h2>Resposta enviada!</h2><p>Obrigado por participar, ${esc(me.name.split(' ')[0])}.</p></div>`;
    if(r.status===409)return msg('Você já respondeu','Cada conta responde uma vez.');
    if(r.status===401){await sb.auth.signOut();return toLogin()}
    if(r.status===422&&j.fields){errs={};const i=steps.findIndex(s=>s.fields.some(f=>j.fields[f.id]));if(i>=0){cur=i;steps[i].fields.forEach(f=>{if(j.fields[f.id])errs[f.id]='Confira este campo.'})}}else errs={};
    draw();alert(r.status===429?'Muitas tentativas. Aguarde um minuto e tente de novo.':'Não foi possível enviar. Confira os campos e tente novamente.');
  }catch{draw();alert('Sem conexão. Tente novamente.');}
}
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')toLogin()});
(async()=>{start()})();
</script>
</body>
</html>
