<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Entrar | Central do FFC</title>
<link rel="icon" href="/mark.png">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root{--bg:#e9ebe9;--side:#f5f6f5;--line:#e6eae7;--acc:#1d754c;--hi:#1d754c;--g:#103f2a;--ink:#17221b;--dim:#69766e;--red:#bc4545;--font:'Plus Jakarta Sans',Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);min-height:100dvh}
button,input{font:inherit;color:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:disabled{opacity:.5;cursor:not-allowed}
h2,p{margin-top:0}h2{font-weight:600;letter-spacing:-.04em}[hidden]{display:none!important}
:focus-visible{outline:3px solid #55ad7b;outline-offset:3px}
#login{min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at bottom left,#d4e4d8,transparent 65%),var(--bg)}
.lbox{width:min(100%,410px);padding:36px;background:#fff;border-radius:28px;display:grid;gap:14px;box-shadow:0 16px 60px #173a2010}
.brand{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:17px;font-weight:700;letter-spacing:-.04em}
.brand img{height:38px;width:38px;object-fit:contain;border-radius:10px}
.brand small{display:block;font-size:10px;color:var(--dim);font-weight:500;letter-spacing:.12em;text-transform:uppercase}
.lbox h2{font-size:27px;margin:0}
.lbox p{font-size:12px;color:var(--dim);margin:0 0 6px}.lbox p b{color:var(--ink);word-break:break-all}
.lbox label{display:block;margin:0;font-size:12px;color:var(--dim)}
input[type=text],input[type=email],input[type=password]{width:100%;background:#fff;border:1px solid #dce4de;border-radius:12px;padding:11px 13px;min-width:0;color:var(--ink)}
.lbox label input{margin-top:6px}
.pw{position:relative}.pw button{position:absolute;right:12px;bottom:12px;border:0;background:0;color:var(--dim);font-size:11px;padding:0}
.hint{font-size:11px;color:var(--dim);margin-top:4px}
.err{color:var(--red);font-size:12px;min-height:18px}.ok{color:var(--acc);font-size:12px}
.btn{border:0;border-radius:99px;padding:12px 20px;font-size:12px;font-weight:600;background:var(--hi);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;width:100%;transition:background .15s,transform .15s}
.lk{background:0;border:0;color:var(--g);font-weight:600;text-decoration:underline;padding:0;font-size:inherit}
.lk:disabled{color:var(--dim);text-decoration:none;cursor:default}
.sm{font-size:12px;color:var(--dim);text-align:center}
.gbox{display:flex;justify-content:center;min-height:44px}.gbtn{border:1px solid #dce4de;background:#fff;border-radius:99px;min-height:44px;padding:10px 20px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;width:100%}.gbtn:hover{background:var(--side)}
.or{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:11px}.or:before,.or:after{content:'';flex:1;height:1px;background:var(--line)}
.boxes{display:flex;gap:8px;justify-content:center;margin:6px 0}
.boxes input{width:44px;height:52px;text-align:center;font-size:22px;font-weight:600;padding:0;border-radius:12px;caret-color:var(--acc)}
.boxes input:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px #1d754c26}
.boxes.bad input{border-color:var(--red);animation:sh .3s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.done{text-align:center;display:grid;gap:10px;justify-items:center;padding:14px 0}
.done .c{width:58px;height:58px;border-radius:50%;background:#e0eadd;color:var(--g);display:grid;place-items:center;font-size:26px}
@media(max-width:620px){.lbox{padding:26px}.boxes input{width:40px;height:50px}}
</style>
</head>
<body>
<div id="login"><div class="lbox" id="app"></div></div>
<script src="/assets/supabase.min.js"></script>
<script src="/config.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sb=supabase.createClient(FFC_SUPABASE_URL,FFC_SUPABASE_KEY);
const OTP_LEN=6;let busy=false;
const nx=new URLSearchParams(location.search).get('next');
const dest=nx&&/^\/(?![\/\\])/.test(nx)?nx:'/';
const tr=e=>{const m=(e&&e.message||'').toLowerCase();
  return m.includes('invalid login')?'E-mail ou senha incorretos.':m.includes('rate limit')||m.includes('seconds')?'Muitas tentativas. Aguarde um pouco e tente de novo.':m.includes('expired')||m.includes('invalid')?'Código inválido ou expirado.':m.includes('password')?'Senha fraca. Use 8 ou mais caracteres.':'Algo deu errado. Tente novamente.'};

/* ---------- login ---------- */
const BRAND='<div class="brand"><img src="/mark.png" alt=""><div>Central do FFC<small>Painel editorial</small></div></div>';
const RED=location.origin+'/login'+(nx&&dest!=='/'?'?next='+encodeURIComponent(dest):'');
async function google(){const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:RED}});
  if(error){const el=$('ien')||$('uen');if(el)el.textContent='Não foi possível entrar com Google. Tente novamente.'}}
/* Botão oficial do Google (abre no próprio site, sem mostrar o endereço do Supabase) */
const GCLIENT='541664184430-0o8gpkpai0ial7e2e9nfme0qme67hc41.apps.googleusercontent.com';
let gsiP=null;
const loadGsi=()=>gsiP||(gsiP=new Promise((ok,no)=>{if(window.google&&google.accounts&&google.accounts.id)return ok();
  const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.async=true;sc.onload=ok;sc.onerror=no;document.head.appendChild(sc);setTimeout(no,6000)}));
async function mountGoogle(){
  try{
    await loadGsi();
    const raw=crypto.randomUUID()+crypto.randomUUID();
    const hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw)))].map(x=>x.toString(16).padStart(2,'0')).join('');
    google_cb=async r=>{const {error}=await sb.auth.signInWithIdToken({provider:'google',token:r.credential,nonce:raw});
      if(error){const el=$('ien')||$('uen');if(el)el.textContent='Não foi possível entrar com Google. Tente novamente.';mountGoogle()}else start()};
    window.google.accounts.id.initialize({client_id:GCLIENT,callback:r=>google_cb(r),nonce:hash,use_fedcm_for_prompt:true,ux_mode:'popup'});
    document.querySelectorAll('[data-gbox]').forEach(box=>{
      box.innerHTML='';const w=Math.max(200,Math.min(400,Math.floor(box.parentElement.clientWidth)||300));
      window.google.accounts.id.renderButton(box,{type:'standard',theme:'outline',size:'large',shape:'pill',text:'continue_with',locale:'pt-BR',width:w});
      box.hidden=false;const fb=box.nextElementSibling;if(fb&&fb.matches('[data-google]'))fb.hidden=true});
  }catch(e){/* mantém o botão alternativo (redirecionamento) */}
}
let google_cb=()=>{};
const lock=(id,on)=>{const b=$(id);if(b)b.disabled=!!on};
function eyes(){document.querySelectorAll('[data-eye]').forEach(b=>b.onclick=()=>{const i=$(b.dataset.eye);i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'mostrar':'ocultar'})}
function showAuth(mode){
  setTimeout(()=>{document.querySelectorAll('[data-google]').forEach(b=>b.onclick=google);mountGoogle()});
  if(mode==='up'){
  $('app').innerHTML=`${BRAND}<h2>Crie sua conta.</h2><p>Confirmamos seu e-mail antes de liberar o acesso. Leva menos de um minuto.</p>
  <div class="gbox" data-gbox hidden></div><button type="button" class="gbtn" data-google><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.3 5.7c4.3-4 6.8-9.9 6.8-17.1z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.3-5.7c-2 1.4-4.9 2.3-8.6 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Continuar com Google</button><div class="or"><span>ou</span></div>
  <form id="fup" novalidate style="display:grid;gap:14px">
    <label>Nome<input type="text" id="un" placeholder="Nome" autocomplete="name" maxlength="80" required></label>
    <label>E-mail<input type="email" id="ue" placeholder="E-mail" autocomplete="email" required></label>
    <label class="pw">Senha<input type="password" id="up" placeholder="Senha" autocomplete="new-password" minlength="8" required><button type="button" data-eye="up">mostrar</button><div class="hint">Mínimo de 8 caracteres.</div></label>
    <div class="err" id="uen" role="alert"></div>
    <button class="btn" id="ugo" type="submit">Criar conta</button></form>
  <div class="sm">Já tem conta? <button type="button" class="lk" id="sw">Entrar</button></div>`;
  eyes();$('sw').onclick=()=>showAuth('in');
  $('fup').onsubmit=async e=>{e.preventDefault();const n=$('un').value.trim(),em=$('ue').value.trim(),pw=$('up').value;
    if(!n||!em)return $('uen').textContent='Preencha nome e e-mail.';if(pw.length<8)return $('uen').textContent='A senha precisa ter 8 ou mais caracteres.';
    lock('ugo',1);const {data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:n},emailRedirectTo:RED}});lock('ugo',0);
    if(error)return $('uen').textContent=tr(error);
    if(data.user&&data.user.identities&&!data.user.identities.length)return $('uen').textContent='Este e-mail já tem conta. Use “Entrar”.';
    data.session?start():showOtp(em,'signup')};
  return}
  $('app').innerHTML=`${BRAND}<h2>Bem-vindo de volta.</h2><p>Entre para responder ao formulário.</p>
  <div class="gbox" data-gbox hidden></div><button type="button" class="gbtn" data-google><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.3 5.7c4.3-4 6.8-9.9 6.8-17.1z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.3-5.7c-2 1.4-4.9 2.3-8.6 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Continuar com Google</button><div class="or"><span>ou</span></div>
  <form id="fin" novalidate style="display:grid;gap:14px">
    <label>E-mail<input type="email" id="ie" placeholder="E-mail" autocomplete="username" required></label>
    <label class="pw">Senha<input type="password" id="ip" placeholder="Senha" autocomplete="current-password" required><button type="button" data-eye="ip">mostrar</button></label>
    <div class="err" id="ien" role="alert"></div>
    <button class="btn" id="igo" type="submit">Entrar</button></form>
  <div class="sm">Novo por aqui? <button type="button" class="lk" id="sw">Criar conta</button></div>`;
  eyes();$('sw').onclick=()=>showAuth('up');
  $('fin').onsubmit=async e=>{e.preventDefault();const em=$('ie').value.trim();if(!em||!$('ip').value)return $('ien').textContent='Preencha e-mail e senha.';
    lock('igo',1);const {error}=await sb.auth.signInWithPassword({email:em,password:$('ip').value});lock('igo',0);
    if(error){ if(/not confirmed/i.test(error.message)){await sb.auth.resend({type:'signup',email:em,options:{emailRedirectTo:RED}});return showOtp(em,'signup')}
      return $('ien').textContent=tr(error)}
    start()};
}

/* ---------- código OTP ---------- */
function showOtp(email,type){
  $('app').innerHTML=`${BRAND}<h2>Verifique seu e-mail</h2><p>Enviamos um e-mail para <b>${esc(email)}</b>. Clique no link da mensagem ou digite o código de ${OTP_LEN} dígitos, se ele vier no e-mail.</p>
  <div class="boxes" id="bx">${[...Array(OTP_LEN)].map((_,i)=>`<input type="text" inputmode="numeric" maxlength="1" autocomplete="${i?'off':'one-time-code'}" aria-label="Dígito ${i+1}">`).join('')}</div>
  <div class="err" id="oer" role="alert"></div>
  <div class="sm">Não recebeu o código? <button class="lk" id="rsb" type="button">Reenviar</button></div>
  <div class="sm"><button class="lk" id="back" type="button" style="font-weight:400">Voltar</button></div>`;
  const ins=[...document.querySelectorAll('#bx input')];ins[0].focus();
  const code=()=>ins.map(i=>i.value).join('');
  const fill=s=>{s=s.replace(/\D/g,'').slice(0,OTP_LEN);ins.forEach((i,k)=>i.value=s[k]||'');(ins[Math.min(s.length,OTP_LEN-1)]).focus();if(s.length===OTP_LEN)verify()};
  ins.forEach((el,i)=>{
    el.oninput=()=>{el.value=el.value.replace(/\D/g,'').slice(-1);if(el.value&&i<OTP_LEN-1)ins[i+1].focus();if(code().length===OTP_LEN)verify()};
    el.onkeydown=e=>{if(e.key==='Backspace'&&!el.value&&i)ins[i-1].focus();if(e.key==='ArrowLeft'&&i)ins[i-1].focus();if(e.key==='ArrowRight'&&i<OTP_LEN-1)ins[i+1].focus()};
    el.onpaste=e=>{e.preventDefault();fill((e.clipboardData||window.clipboardData).getData('text'))};
  });
  async function verify(){
    if(busy)return;busy=true;ins.forEach(i=>i.disabled=true);$('oer').textContent='';
    const {error}=await sb.auth.verifyOtp({email,token:code(),type});busy=false;
    if(error){ins.forEach(i=>{i.disabled=false;i.value=''});$('bx').classList.add('bad');setTimeout(()=>$('bx').classList.remove('bad'),600);ins[0].focus();return $('oer').textContent=tr(error)}
    $('app').innerHTML=`${BRAND}<div class="done"><div class="c">✓</div><h2>Verificado!</h2><p>Sua conta foi confirmada.</p></div>`;setTimeout(start,1100);
  }
  let t=0;const rsb=$('rsb');
  const cool=()=>{t=30;rsb.disabled=true;const iv=setInterval(()=>{t--;rsb.textContent=t>0?`Reenviar (${t}s)`:'Reenviar';if(t<=0){clearInterval(iv);rsb.disabled=false}},1000);rsb.textContent='Reenviar (30s)'};cool();
  rsb.onclick=async()=>{const {error}=type==='signup'?await sb.auth.resend({type:'signup',email,options:{emailRedirectTo:RED}}):await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:RED}});
    $('oer').textContent=error?tr(error):'Código reenviado.';if(!error)cool()};
  $('back').onclick=()=>showAuth('in');
}

async function go(){const {data}=await sb.auth.getSession();if(data.session&&data.session.user.email_confirmed_at)return location.replace(dest);showAuth('in')}
const start=go;
go();
</script>
</body>
</html>
